name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Qibla and Sholat by FF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: Ensure gradlew is executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          # Copy to a clean, human-readable name in root
          cp "$APK_PATH" ./QiblaAndSholatByFF-${{ github.event.inputs.build_type || 'debug' }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QiblaAndSholatByFF-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: ./QiblaAndSholatByFF-*.apk
          retention-days: 30

      - name: Create Release and Attach APK (on Tag or Manual Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./QiblaAndSholatByFF-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
