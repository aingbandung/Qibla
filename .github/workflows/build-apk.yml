name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Qibla and Sholat by FF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android native platform..."
            npx cap add android
          fi
          echo "Syncing web assets and plugins into native Android project..."
          npx cap sync android

          # Inject GPS and Notification permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              echo "Injecting Location and Notification permissions into $MANIFEST..."
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            fi
          fi

          # Update Android launcher app icons with the new Qibla symbol
          echo "Updating Android launcher icons with Qibla symbol..."
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/app-icon.jpg "$dir/ic_launcher.png" || true
              cp public/app-icon.jpg "$dir/ic_launcher_round.png" || true
              cp public/app-icon.jpg "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Ensure gradlew is executable
        run: |
          chmod +x android/gradlew

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 || env.JAVA_HOME }}
        run: |
          cd android
          echo "Using Java at: $JAVA_HOME"
          java -version
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"
          fi
          cd ..

      - name: Locate & Prepare Generated APK
        id: prepare_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file generated in build outputs!"
            exit 1
          fi
          echo "Found generated APK at: $APK_PATH"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          FINAL_NAME="QiblaAndSholatByFF-${BUILD_TYPE}.apk"
          cp "$APK_PATH" "./$FINAL_NAME"
          echo "Copied to ./$FINAL_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QiblaAndSholatByFF-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: ./QiblaAndSholatByFF-*.apk
          retention-days: 30

      - name: Create GitHub Release (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./QiblaAndSholatByFF-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
